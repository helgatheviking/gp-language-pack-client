# Create a GitHub release when a version tag is pushed.
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release

on:
  push:
    tags:
      # Semver (https://semver.org/) release pattern.
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  release:
    name: "Create GitHub release."
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checks out the repository."
        uses: actions/checkout@v7
        with:
          # Full history and tags, so we can find the previous tag.
          fetch-depth: 0

      - name: "Build changelog from commits."
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          range="${prev:+$prev..}$TAG"
          {
            echo "## Changelog"
            echo
            git log "$range" --no-merges --pretty=format:'- %s' \
              | grep -viE '^- version bump|^- version [0-9]' || true
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: "Create release."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) flags="--prerelease" ;;
          esac
          gh release create "$TAG" --title "$TAG" --notes-file CHANGELOG.md $flags
